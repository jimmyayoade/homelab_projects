# Runs scripts/validate.sh on every pull request (Renovate's included) and
# on every push to main. Flux applies main within a minute, so this is the
# last check before a change reaches the cluster.
name: validate

on:
  pull_request:
  push:
    branches:
    - main

# Read-only token: the job only checks out and validates.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    # Actions are pinned by commit SHA, like the images; Renovate bumps them.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Installs the tool versions from mise.toml.
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
    - run: scripts/validate.sh
