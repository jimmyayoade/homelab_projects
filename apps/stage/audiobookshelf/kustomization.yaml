apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiobookshelf
resources:
- ../../base/audiobookshelf/
- cloudflare.yaml
- cloudflare-secret.yaml
# The content hash kustomize adds to the name changes the Deployment's
# pod template, so a config edit rolls the cloudflared pods by itself.
configMapGenerator:
- name: cloudflared
  files:
  - config.yaml=cloudflared-config.yaml
