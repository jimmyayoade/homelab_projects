apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- namespace.yaml
- service.yaml
- storage.yaml
# Read as environment variables at startup; the hash in the generated
# name makes a change here roll the pod.
configMapGenerator:
- name: audiobookshelf-configmap
  literals:
  - PORT=3005
  - TZ=America/New_York
