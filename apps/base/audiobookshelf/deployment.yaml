apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: audiobookshelf
        image: ghcr.io/advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
        ports:
        - containerPort: 3005
          protocol: TCP
        volumeMounts:
        - name: audiobookshelf-config-claim
          mountPath: /config
        - name: audiobookshelf-metadata-claim
          mountPath: /metadata
        - name: audiobookshelf-audiobooks-claim
          mountPath: /audiobooks
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        envFrom:
        - configMapRef:
            name: audiobookshelf-configmap
      volumes:
      - name: audiobookshelf-metadata-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-metadata-pvc
      - name: audiobookshelf-audiobooks-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-audiobooks-pvc
      - name: audiobookshelf-config-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-config-pvc
