apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: audiobookshelf
        image: ghcr.io/advplyr/audiobookshelf@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
        ports:
        - containerPort: 3005
          protocol: TCP
        volumeMounts:
        - name: audiobookshelf-config-claim
          mountPath: /config
        - name: audiobookshelf-metadata-claim
          mountPath: /metadata
        - name: audiobookshelf-audiobooks-claim
          mountPath: /audiobooks
        - name: audiobookshelf-podcasts-claim
          mountPath: /podcasts
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        envFrom:
        - configMapRef:
            name: audiobookshelf-configmap
      volumes:
      - name: audiobookshelf-metadata-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-metadata-pvc
      - name: audiobookshelf-audiobooks-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-audiobooks-pvc
      - name: audiobookshelf-podcasts-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-podcasts-pvc
      - name: audiobookshelf-config-claim
        persistentVolumeClaim:
          claimName: audiobookshelf-config-pvc