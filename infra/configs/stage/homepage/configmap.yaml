apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
        - Gitlab:
            - abbr: GL
              href: https://gitlab.com/
  services.yaml: |
    - My First Group:
        - My First Service:
            href: https://bookmark.jimmyalabs.org/
            description: This is for bookmarks public

    - My Home Services:
        - Audio Book Shelf:
            href: http://abs.jimmyalabs.org/
            description: this is for audiobooks local
        - Kube Prometheus stack:
            href: grafana.jimmyalabs.org
            description: monitoring dashboard

    - Bookmaks:
        - Hacker News:
            href: https://news.ycombinator.com/
            description: News about hacks.
        - Drive and Listen
            href: https://driveandlisten.app/
            description: drive and listen in various cities.
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""