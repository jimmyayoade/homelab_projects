apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: '@daily'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - image: renovate/renovate:44.260.0@sha256:85bab2f3a82b18df7e239fdf56b31e672bc744a468d9b0490468001ec7fea8f6
            name: renovate
            args:
            - jimmyayoade/homelab_projects
            envFrom:
            - secretRef:
                name: renovate-token
            - configMapRef:
                name: renovate-configmap
