apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 12h
  chart:
    spec:
      chart: reloader
      version: "2.2.x"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: v1.4.25
      digest: sha256:db8b1818f5da373ab85c05b30220fcae80a9ac0532052e6d68a6a5999111f18f
    reloader:
      watchGlobally: true
      enableHA: true
      readOnlyRootFilesystem: true
      deployment:
        replicas: 3
      containerSecurityContext:
        capabilities:
          drop:
          - ALL
        allowPrivilegeEscalation: false
